  </div>
</div>
<style>
#acilis-ekrani{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;z-index:9999;transition:opacity 1s ease}
.logo-konteyner{text-align:center}
.dvb-logo-parlak{width:min(78vw,380px);height:auto;display:block;margin:0 auto;animation:logo-parla 2s infinite alternate}
.yukleniyor-text{color:#fff;margin-top:20px;font-family:monospace;letter-spacing:2px;font-size:.9rem}
.yukleme-cubugu{width:200px;height:3px;background:#222;margin:15px auto;border-radius:10px;overflow:hidden}
.doluluk{width:0;height:100%;background:#fff;animation:dol 2.5s forwards}
@keyframes logo-parla{from{opacity:.75}to{opacity:1}}
@keyframes dol{to{width:100%}}
</style>

<script>
const CONFIG = {
  API_KEY: "BURAYA_YENİ_ANAHTARINI_YAZ",
  MODEL: "gemini-2.5-flash",
  KIMLIK: "Sen B-GPT'sin. Kurucun Bilal Erdoğan Özel, sahibi olduğun şirket DVB DİGİTAL STUDİOS. Sorulursa bunu gururla söyle. Çok havalı, kısa ve hacker gibi cevap ver. Kullanıcı hangi dilde yazarsa o dilde cevap ver."
};
const sohbet = [];
const cikti = document.getElementById('chat-output');
const kutu = document.getElementById('user-message');
let mesgul = false;

function ekle(metin, sinif) {
  const d = document.createElement('div');
  d.className = sinif;
  d.style.whiteSpace = 'pre-wrap';
  d.textContent = metin;
  cikti.appendChild(d);
  cikti.scrollTop = cikti.scrollHeight;
  return d;
}

async function yaz(el, t) {
  const adim = Math.max(1, Math.ceil(t.length / 180));
  for (let i = 0; i < t.length; i += adim) {
    el.textContent = t.slice(0, i + adim);
    cikti.scrollTop = cikti.scrollHeight;
    await new Promise(r => setTimeout(r, 14));
  }
  el.textContent = t;
}

async function cevapAl() {
  if (CONFIG.API_KEY.startsWith("BURAYA")) return "Anahtar eksik: CONFIG.API_KEY alanına yeni Gemini anahtarını yaz.";
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + CONFIG.MODEL + ":generateContent", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": CONFIG.API_KEY },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: CONFIG.KIMLIK }] },
      contents: sohbet.slice(-20).map(m => ({ role: m.role, parts: [{ text: m.text }] }))
    })
  });
  if (!res.ok) {
    const c = res.status;
    if (c === 404) return "Model bulunamadı. CONFIG.MODEL değerini güncel bir Gemini modeliyle değiştir.";
    if (c === 400 || c === 403) return "Anahtar reddedildi. Anahtarın geçerli ve bu siteye izinli olduğunu kontrol et.";
    if (c === 429) return "Çok fazla istek geldi. Biraz bekleyip tekrar dene.";
    return "Sunucu hatası (" + c + "). Birazdan tekrar dene.";
  }
  const d = await res.json();
  return (d.candidates && d.candidates[0] && d.candidates[0].content.parts.map(p => p.text || "").join("")) || "Cevap alınamadı. Soruyu farklı yazıp tekrar dene.";
}

async function bGPTGonder() {
  const metin = kutu.value.trim();
  if (!metin || mesgul) return;
  mesgul = true;
  const hos = document.getElementById('welcome-box');
  if (hos) hos.remove();
  ekle(metin, 'user-msg');
  sohbet.push({ role: 'user', text: metin });
  kutu.value = '';
  const bot = ekle('Yazıyor…', 'ai-msg');
  let r;
  try { r = await cevapAl(); } catch (e) { r = 'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.'; }
  await yaz(bot, r);
  sohbet.push({ role: 'model', text: r });
  mesgul = false;
}

kutu.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); bGPTGonder(); }
});

window.addEventListener('load', () => {
  const a = document.getElementById('acilis-ekrani');
  if (a) setTimeout(() => { a.style.opacity = '0'; setTimeout(() => a.remove(), 1000); }, 2600);
});
</script>
